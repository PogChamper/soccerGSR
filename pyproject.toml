[project]
name = "soccer-gsr"
version = "2.0.0"
description = "Offline game-state reconstruction for soccer broadcast clips"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.20.0",
    "fastapi==0.139.2",
    "gdown==5.2.2",
    "greenlet==3.1.1",
    "lap==0.5.12",
    "numpy==1.26.4",
    "onnxruntime-gpu[cuda,cudnn]==1.21.1",
    "opencv-python-headless==4.10.0.84",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "scikit-learn==1.6.0",
    "scipy==1.14.1",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.32.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.9.1",
]

[tool.uv]
package = false
required-version = ">=0.11.25"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
